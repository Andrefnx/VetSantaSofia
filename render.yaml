databases:
  - name: vetsantasofia-db
    databaseName: vetsantasofia
    user: vetsantasofia

services:
  - type: web
    name: vetsantasofia-demo
    runtime: python
    buildCommand: ./build.sh
    startCommand: python manage.py cargar_demo && gunicorn veteriaria.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetsantasofia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.8

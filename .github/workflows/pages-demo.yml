name: Deploy interactive demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare demo layout
        run: |
          cat demo/layout.js >> demo/app.js
          cat demo/final-tweaks.js >> demo/app.js
          cat demo/palette-tweaks.js >> demo/app.js
          cat demo/dashboard-polish.js >> demo/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
